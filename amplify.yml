# AWS Amplify Hosting build specification.
#
# Detected automatically when the repository is connected, so there are no build
# settings to type into the console. The app lives in a npm workspace, hence the
# appRoot and the explicit workspace-aware commands.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # Install from the monorepo root so workspace links resolve.
            - cd ../.. && npm ci
            # The web app consumes @civicsos/core; build it before Next runs.
            - npm run build -w @civicsos/core
            # Fail the deployment rather than shipping a broken build.
            - npm test
            - cd apps/web
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
