<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>CivicSOS AWS architecture</title>
  <desc>Serverless architecture: Amplify Hosting, API Gateway, three Lambda functions, DynamoDB, S3, Cognito, EventBridge, CloudWatch and SSM Parameter Store, plus an optional ECS Fargate worker and a WAF web ACL awaiting CloudFront verification.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1060" height="800" fill="#f7f8fa"/>

  <text x="40" y="46" font-size="22" font-weight="600" fill="#172033">CivicSOS — AWS architecture</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Region ap-south-1 (Mumbai) unless noted. Every component is serverless and scales to zero.</text>

  <!-- Legend -->
  <g font-size="11" fill="#64748b">
    <rect x="762" y="22" width="258" height="74" rx="8" fill="#ffffff" stroke="#e2e6eb"/>
    <rect x="778" y="35" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="797" y="44">Deployed and live</text>
    <rect x="778" y="54" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="797" y="63">Built and tested, not yet deployed</text>
    <rect x="778" y="73" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#e2e6eb" stroke-width="1.5"/>
    <text x="797" y="82">External service, not AWS</text>
  </g>

  <!-- ===== Row 1 ===== -->
  <g>
    <rect x="40" y="108" width="220" height="62" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="150" y="134" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">Citizen's browser</text>
    <text x="150" y="153" font-size="11" fill="#64748b" text-anchor="middle">Light-mode Next.js app, mobile-first</text>
  </g>
  <g>
    <rect x="330" y="108" width="300" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="480" y="131" font-size="12.5" font-weight="600" fill="#172033" text-anchor="middle">AWS WAF — CLOUDFRONT scope (us-east-1)</text>
    <text x="480" y="147" font-size="10.5" fill="#64748b" text-anchor="middle">3 managed rule groups + per-IP rate limit</text>
    <text x="480" y="162" font-size="10.5" fill="#b45309" text-anchor="middle">Attaches once CloudFront verification clears</text>
  </g>

  <!-- ===== Row 2 ===== -->
  <g>
    <rect x="40" y="208" width="220" height="70" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="150" y="232" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">Amplify Hosting</text>
    <text x="150" y="250" font-size="11" fill="#64748b" text-anchor="middle">Next.js 15 App Router, SSR</text>
    <text x="150" y="266" font-size="11" fill="#64748b" text-anchor="middle">CDN + rebuild on push to main</text>
  </g>
  <g>
    <rect x="330" y="208" width="220" height="70" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="440" y="232" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">API Gateway</text>
    <text x="440" y="250" font-size="11" fill="#64748b" text-anchor="middle">HTTP API · CORS · 10 rps throttle</text>
    <text x="440" y="266" font-size="11" fill="#64748b" text-anchor="middle">~⅓ the cost of a REST API</text>
  </g>
  <g>
    <rect x="600" y="208" width="190" height="70" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="695" y="232" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">Cognito</text>
    <text x="695" y="250" font-size="11" fill="#64748b" text-anchor="middle">User pool, SRP auth</text>
    <text x="695" y="266" font-size="11" fill="#64748b" text-anchor="middle">ID tokens verified in-process</text>
  </g>
  <g>
    <rect x="820" y="208" width="200" height="70" rx="10" fill="#ffffff" stroke="#e2e6eb"/>
    <text x="920" y="232" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">Gemini (free tier)</text>
    <text x="920" y="250" font-size="11" fill="#64748b" text-anchor="middle">Classification + draft prose</text>
    <text x="920" y="266" font-size="11" fill="#64748b" text-anchor="middle">PII stripped before the call</text>
  </g>

  <!-- ===== Lambda band ===== -->
  <rect x="40" y="316" width="780" height="126" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="58" y="337" font-size="11" font-weight="600" fill="#1d4ed8" letter-spacing="0.4">AWS LAMBDA · Node.js 20 · least-privilege IAM per function · @civicsos/core imports no AWS SDK</text>

  <g>
    <rect x="58" y="348" width="234" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="175" y="371" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">api</text>
    <text x="175" y="389" font-size="10.5" fill="#64748b" text-anchor="middle">Router, services, rules engine</text>
    <text x="175" y="405" font-size="10.5" fill="#64748b" text-anchor="middle">Authorizes every request server-side</text>
  </g>
  <g>
    <rect x="312" y="348" width="234" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="429" y="371" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">events</text>
    <text x="429" y="389" font-size="10.5" fill="#64748b" text-anchor="middle">Notifications, immutable audit</text>
    <text x="429" y="405" font-size="10.5" fill="#64748b" text-anchor="middle">Applies status-check results</text>
  </g>
  <g>
    <rect x="566" y="348" width="234" height="76" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="683" y="371" font-size="13" font-weight="600" fill="#172033" text-anchor="middle">scheduler</text>
    <text x="683" y="389" font-size="10.5" fill="#64748b" text-anchor="middle">Daily follow-up + escalation sweep</text>
    <text x="683" y="405" font-size="10.5" fill="#64748b" text-anchor="middle">Starts the status worker</text>
  </g>

  <!-- ===== EventBridge ===== -->
  <g>
    <rect x="850" y="316" width="170" height="126" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="935" y="341" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">EventBridge</text>
    <text x="935" y="361" font-size="10.5" fill="#64748b" text-anchor="middle">civicsos-prod-events</text>
    <line x1="868" y1="373" x2="1002" y2="373" stroke="#e2e6eb"/>
    <text x="935" y="391" font-size="10.5" fill="#64748b" text-anchor="middle">domain-events rule</text>
    <text x="935" y="408" font-size="10.5" fill="#64748b" text-anchor="middle">daily-sweep rule</text>
    <text x="935" y="425" font-size="10.5" fill="#64748b" text-anchor="middle">cron 02:30 UTC = 08:00 IST</text>
  </g>

  <!-- ===== Data row ===== -->
  <g>
    <rect x="40" y="484" width="238" height="88" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="159" y="508" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">DynamoDB</text>
    <text x="159" y="527" font-size="10.5" fill="#64748b" text-anchor="middle">Single table, 3 GSIs, on-demand</text>
    <text x="159" y="543" font-size="10.5" fill="#64748b" text-anchor="middle">Sparse day-partitioned follow-up index</text>
    <text x="159" y="559" font-size="10.5" fill="#64748b" text-anchor="middle">No Scan in any normal flow</text>
  </g>
  <g>
    <rect x="302" y="484" width="238" height="88" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="421" y="508" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">S3 — evidence</text>
    <text x="421" y="527" font-size="10.5" fill="#64748b" text-anchor="middle">Private bucket, public access blocked</text>
    <text x="421" y="543" font-size="10.5" fill="#64748b" text-anchor="middle">Pre-signed PUT/GET only (api)</text>
    <text x="421" y="559" font-size="10.5" fill="#64748b" text-anchor="middle">Lifecycle expiry on old objects</text>
  </g>
  <g>
    <rect x="564" y="484" width="220" height="88" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="674" y="508" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">SSM Parameter Store</text>
    <text x="674" y="527" font-size="10.5" fill="#64748b" text-anchor="middle">Two SecureStrings</text>
    <text x="674" y="543" font-size="10.5" fill="#64748b" text-anchor="middle">Gemini key · guest session secret</text>
    <text x="674" y="559" font-size="10.5" fill="#64748b" text-anchor="middle">Never in Git, never in the browser</text>
  </g>
  <g>
    <rect x="862" y="484" width="158" height="88" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
    <text x="941" y="508" font-size="14" font-weight="600" fill="#172033" text-anchor="middle">CloudWatch</text>
    <text x="941" y="527" font-size="10.5" fill="#64748b" text-anchor="middle">Structured logs, 7d</text>
    <text x="941" y="543" font-size="10.5" fill="#64748b" text-anchor="middle">3 alarms · Budgets</text>
    <text x="941" y="559" font-size="10.5" fill="#64748b" text-anchor="middle">No PII ever logged</text>
  </g>

  <!-- ===== Optional worker ===== -->
  <g>
    <rect x="40" y="622" width="980" height="112" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="60" y="645" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="0.3">OPTIONAL — built and tested; deploys only with  -c enableWorker=true</text>

    <rect x="60" y="656" width="268" height="62" rx="9" fill="#f7f8fa" stroke="#d3d9e0"/>
    <text x="194" y="678" font-size="12.5" font-weight="600" fill="#172033" text-anchor="middle">VPC — 2 public subnets</text>
    <text x="194" y="695" font-size="10.5" fill="#64748b" text-anchor="middle">natGateways: 0 — nothing bills hourly</text>
    <text x="194" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">Egress-only security group</text>

    <rect x="346" y="656" width="290" height="62" rx="9" fill="#f7f8fa" stroke="#d3d9e0"/>
    <text x="491" y="678" font-size="12.5" font-weight="600" fill="#172033" text-anchor="middle">ECS Fargate — status worker</text>
    <text x="491" y="695" font-size="10.5" fill="#64748b" text-anchor="middle">Playwright + Chromium, one-shot task</text>
    <text x="491" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">IAM: events:PutEvents and nothing else</text>

    <rect x="654" y="656" width="346" height="62" rx="9" fill="#f7f8fa" stroke="#d3d9e0"/>
    <text x="827" y="678" font-size="12.5" font-weight="600" fill="#172033" text-anchor="middle">Reads public complaint status pages</text>
    <text x="827" y="695" font-size="10.5" fill="#64748b" text-anchor="middle">Files nothing. Stops at any login wall or CAPTCHA.</text>
    <text x="827" y="710" font-size="10.5" fill="#64748b" text-anchor="middle">Observes only; the deterministic core decides.</text>
  </g>

  <!-- ================= Connections ================= -->

  <!-- citizen -> amplify -->
  <path d="M150 170 V208" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <!-- citizen -> WAF (pending) -->
  <path d="M260 139 H330" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#am)"/>

  <!-- amplify -> api gateway -->
  <path d="M260 243 H330" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <text x="295" y="236" font-size="10" fill="#2563eb" text-anchor="middle">HTTPS</text>

  <!-- amplify -> cognito, routed above row 2 -->
  <path d="M150 208 V190 H695 V208" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="420" y="185" font-size="10" fill="#64748b" text-anchor="middle">SRP sign-in, direct from the browser</text>

  <!-- api gateway -> lambda band -->
  <path d="M440 278 V316" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <!-- cognito -> band (token verification) -->
  <path d="M660 278 V316" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <!-- gemini <- -> band -->
  <path d="M920 278 V298 H760 V316" stroke="#64748b" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="838" y="292" font-size="9.5" fill="#64748b" text-anchor="middle">validated JSON · deterministic fallback</text>

  <!-- band <-> eventbridge -->
  <path d="M820 362 H850" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>
  <path d="M850 400 H820" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ab)"/>

  <!-- lambda -> data rail -->
  <path d="M175 424 V462" stroke="#64748b" stroke-width="1.3" fill="none"/>
  <path d="M429 424 V462" stroke="#64748b" stroke-width="1.3" fill="none"/>
  <path d="M683 424 V462" stroke="#64748b" stroke-width="1.3" fill="none"/>
  <path d="M159 462 H941" stroke="#64748b" stroke-width="1.3" fill="none"/>
  <path d="M159 462 V484" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <path d="M421 462 V484" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <path d="M674 462 V484" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <path d="M941 462 V484" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#a)"/>

  <!-- scheduler -> fargate, threading the gap between SSM and CloudWatch -->
  <path d="M800 424 V440 H823 V622" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="823" y="604" font-size="10" fill="#94a3b8" text-anchor="middle">ecs:RunTask — one task per batch</text>

  <!-- fargate -> eventbridge -->
  <path d="M1000 656 V600 H1040 V430 H1020" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="1006" y="590" font-size="10" fill="#94a3b8" text-anchor="end">PutEvents</text>

  <!-- Footnotes -->
  <text x="40" y="766" font-size="11" fill="#64748b">Citizens never reach DynamoDB, S3 or Gemini directly — every request is authorized server-side in the api function before any store is touched.</text>
  <text x="40" y="784" font-size="11" fill="#64748b">Routing, evidence rules, response windows, escalation policy and status transitions are all deterministic. The model contributes classification and prose, never a decision.</text>
</svg>
