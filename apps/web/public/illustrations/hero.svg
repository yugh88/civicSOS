<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" role="img" aria-label="Illustration of a clean neighbourhood with buildings, trees, a park bench and a street light">
  <defs>
    <linearGradient id="hSky" x1="280" y1="0" x2="280" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/><stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="hGlow" x1="430" y1="120" x2="430" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hGround" x1="280" y1="300" x2="280" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5"/><stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <rect width="560" height="400" rx="28" fill="url(#hSky)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="112" cy="70" rx="40" ry="17"/><ellipse cx="142" cy="62" rx="26" ry="20"/>
    <ellipse cx="438" cy="52" rx="32" ry="14"/><ellipse cx="462" cy="46" rx="20" ry="16"/>
  </g>

  <!-- skyline, back to front -->
  <g opacity=".45">
    <rect x="52" y="150" width="58" height="160" rx="6" fill="#C7D2FE"/>
    <rect x="452" y="168" width="54" height="142" rx="6" fill="#C7D2FE"/>
  </g>

  <rect x="120" y="108" width="78" height="202" rx="8" fill="#A5B4FC"/>
  <rect x="300" y="128" width="70" height="182" rx="8" fill="#A5B4FC"/>
  <rect x="208" y="84" width="84" height="226" rx="9" fill="#818CF8"/>
  <rect x="380" y="158" width="62" height="152" rx="8" fill="#C7D2FE"/>

  <!-- windows -->
  <g fill="#FFFFFF" opacity=".85">
    <rect x="134" y="126" width="14" height="18" rx="3"/><rect x="158" y="126" width="14" height="18" rx="3"/>
    <rect x="134" y="158" width="14" height="18" rx="3"/><rect x="158" y="158" width="14" height="18" rx="3"/>
    <rect x="134" y="190" width="14" height="18" rx="3"/><rect x="158" y="190" width="14" height="18" rx="3"/>
    <rect x="222" y="104" width="16" height="20" rx="3"/><rect x="250" y="104" width="16" height="20" rx="3"/>
    <rect x="222" y="140" width="16" height="20" rx="3"/><rect x="250" y="140" width="16" height="20" rx="3"/>
    <rect x="222" y="176" width="16" height="20" rx="3"/><rect x="250" y="176" width="16" height="20" rx="3"/>
    <rect x="314" y="148" width="14" height="18" rx="3"/><rect x="338" y="148" width="14" height="18" rx="3"/>
    <rect x="314" y="180" width="14" height="18" rx="3"/><rect x="338" y="180" width="14" height="18" rx="3"/>
    <rect x="392" y="178" width="14" height="18" rx="3"/><rect x="414" y="178" width="14" height="18" rx="3"/>
    <rect x="392" y="210" width="14" height="18" rx="3"/><rect x="414" y="210" width="14" height="18" rx="3"/>
  </g>
  <g fill="#FDE68A">
    <rect x="158" y="190" width="14" height="18" rx="3"/>
    <rect x="250" y="140" width="16" height="20" rx="3"/>
    <rect x="314" y="180" width="14" height="18" rx="3"/>
  </g>

  <!-- ground -->
  <path d="M0 310h560v62a28 28 0 0 1-28 28H28A28 28 0 0 1 0 372z" fill="url(#hGround)"/>
  <path d="M0 306h560v10H0z" fill="#CBD5E1" opacity=".5"/>

  <!-- lamp post with glow -->
  <path d="M398 120h64v96h-64z" fill="url(#hGlow)"/>
  <rect x="426" y="150" width="6" height="160" rx="3" fill="#475569"/>
  <rect x="408" y="304" width="42" height="8" rx="4" fill="#334155"/>
  <path d="M415 143a14 14 0 0 1 28 0l4 10h-36z" fill="#334155"/>
  <ellipse cx="429" cy="150" rx="11" ry="5" fill="#FDE68A"/>

  <!-- trees -->
  <g>
    <rect x="86" y="272" width="9" height="42" rx="4" fill="#78350F" opacity=".7"/>
    <circle cx="90" cy="254" r="34" fill="#34D399"/><circle cx="68" cy="266" r="24" fill="#6EE7B7"/><circle cx="112" cy="266" r="22" fill="#6EE7B7"/>
  </g>
  <g>
    <rect x="352" y="282" width="8" height="34" rx="4" fill="#78350F" opacity=".7"/>
    <circle cx="356" cy="268" r="27" fill="#10B981"/><circle cx="338" cy="278" r="18" fill="#6EE7B7"/><circle cx="374" cy="278" r="17" fill="#6EE7B7"/>
  </g>
  <g>
    <rect x="256" y="288" width="7" height="28" rx="3" fill="#78350F" opacity=".7"/>
    <circle cx="259" cy="276" r="22" fill="#34D399"/>
  </g>

  <!-- bench -->
  <g>
    <rect x="150" y="286" width="86" height="9" rx="4" fill="#4F46E5"/>
    <rect x="150" y="272" width="86" height="8" rx="4" fill="#6366F1"/>
    <rect x="156" y="295" width="7" height="22" rx="3" fill="#334155"/>
    <rect x="223" y="295" width="7" height="22" rx="3" fill="#334155"/>
  </g>

  <!-- path -->
  <path d="M0 348c120-18 240-18 360 0s140 20 200 14v20H0z" fill="#E2E8F0" opacity=".7"/>

  <!-- small plant sprout, echoes the logo -->
  <g transform="translate(486 262)">
    <path d="M8 34V14" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 18c-9 0-13-6-13-12 7-1 13 4 13 12z" fill="#34D399"/>
    <path d="M8 22c9-1 12-7 12-13-7-1-12 5-12 13z" fill="#6EE7B7"/>
  </g>
</svg>
