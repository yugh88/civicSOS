  <rect width="400" height="220" fill="url(#gS)"/>
  <path d="M0 150h400v70H0z" fill="#CBD5E1" opacity=".6"/>
  <path d="M0 146h400v8H0z" fill="#94A3B8" opacity=".5"/>
