  <g fill="#64748B"><ellipse cx="74" cy="168" rx="36" ry="24"/><ellipse cx="330" cy="172" rx="30" ry="20"/></g>
  <g fill="#475569"><ellipse cx="60" cy="158" rx="20" ry="14"/><ellipse cx="342" cy="164" rx="16" ry="11"/></g>
