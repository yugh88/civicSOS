<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="A hazard on the street with a fallen power line and warning cone">
  <defs><linearGradient id="fS" x1="200" y1="0" x2="200" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#FEF2F2"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient></defs>
  <rect width="400" height="220" fill="url(#fS)"/>
  <path d="M0 158h400v62H0z" fill="#94A3B8" opacity=".4"/>
  <path d="M0 154h400v6H0z" fill="#64748B" opacity=".45"/>
  <!-- crossing -->
  <g fill="#F8FAFC" opacity=".85"><rect x="40" y="176" width="26" height="40" rx="3"/><rect x="82" y="176" width="26" height="40" rx="3"/><rect x="124" y="176" width="26" height="40" rx="3"/></g>
  <!-- pole with drooping wire -->
  <rect x="300" y="42" width="9" height="116" rx="4" fill="#475569"/>
