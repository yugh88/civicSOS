  <g fill="#60A5FA"><circle cx="160" cy="152" r="6"/><circle cx="142" cy="172" r="4.5"/><circle cx="252" cy="148" r="6"/><circle cx="272" cy="170" r="4.5"/><circle cx="206" cy="168" r="5"/></g>
  <g fill="#93C5FD" opacity=".8"><circle cx="176" cy="136" r="3.5"/><circle cx="238" cy="134" r="3.5"/></g>
  <g fill="#CBD5E1" opacity=".55"><rect x="26" y="20" width="30" height="52" rx="5"/><rect x="330" y="30" width="26" height="42" rx="5"/></g>
