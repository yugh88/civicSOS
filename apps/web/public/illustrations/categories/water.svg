  <rect x="0" y="72" width="400" height="46" rx="8" fill="url(#wP)"/>
  <rect x="150" y="66" width="26" height="58" rx="5" fill="#64748B"/>
  <rect x="246" y="66" width="26" height="58" rx="5" fill="#64748B"/>
