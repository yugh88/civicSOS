<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none" role="img" aria-label="A leaking water pipe">
  <defs><linearGradient id="wS" x1="200" y1="0" x2="200" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
  <linearGradient id="wP" x1="200" y1="72" x2="200" y2="118" gradientUnits="userSpaceOnUse"><stop stop-color="#94A3B8"/><stop offset=".5" stop-color="#CBD5E1"/><stop offset="1" stop-color="#64748B"/></linearGradient></defs>
  <rect width="400" height="220" fill="url(#wS)"/>
  <path d="M0 168h400v52H0z" fill="#94A3B8" opacity=".35"/>
  <!-- puddle -->
  <ellipse cx="206" cy="190" rx="118" ry="24" fill="#60A5FA" opacity=".35"/>
  <ellipse cx="206" cy="187" rx="86" ry="16" fill="#3B82F6" opacity=".35"/>
